<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anker0oo 的 3D 建模作品集</title>
  <style>
    body { margin: 0; font-family: sans-serif; background: #f5f5f5; text-align: center; padding: 20px; }
    h1 { margin-top: 30px; color: #333; }
    .grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 30px; }
    .card { background: white; border-radius: 10px; padding: 20px; width: 300px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .card h2 { font-size: 18px; color: #444; margin-bottom: 10px; }
    model-viewer { width: 100%; height: 250px; background: #eee; border-radius: 8px; margin-bottom: 15px; }
    .btn { display: inline-block; background: #0066ff; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-size: 14px; transition: 0.3s; }
    .btn:hover { background: #0052cc; }
  </style>
</head>
<body>

  <h1>Anker0oo 的 3D 作品集</h1>
  <p>点击下方作品卡片查看详情</p>

  <div class="grid">
    <!-- 第一个作品：沙发 -->
    <div class="card">
      <h2>沙发建模作业</h2>
      <model-viewer 
        src="modelsofa.glb" 
        camera-controls 
        auto-rotate 
        shadow-intensity="1">
      </model-viewer>
      <!-- 这个链接可以指向另一个网页，这里暂时直接用模型文件 -->
      <a href="modelsofa.glb" target="_blank" class="btn">查看原模型</a>
    </div>

    <!-- 以后加新作业，就复制上面那个 <div class="card"> 到 </div> 的部分，改改名字就行 -->
    
  </div>

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.2.0/model-viewer.min.js"></script>
</body>
</html>
